<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novedades de supervisores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F2F3FA; --superficie:#FFFFFF; --hundido:#E7E9F6;
  --tinta:#12173A; --tinta-2:#5B6286; --linea:#D8DBEC;
  --marca:#3447F5; --marca-2:#7A4DF3; --marca-tinta:#FFFFFF; --foco:#3447F5; --acento:#FFC53D;
  --sombra:0 1px 2px rgba(18,23,58,.06),0 10px 26px -14px rgba(52,71,245,.28);
  --sombra-alta:0 2px 4px rgba(18,23,58,.08),0 18px 40px -16px rgba(52,71,245,.4);
  --e-nueva:#B87A00; --e-revision:#0B86A8; --e-proceso:#7A4DF3; --e-resuelta:#17895A; --e-descartada:#7B819C;
  --error:#C62828;
  --titulos:"Unbounded","Trebuchet MS","Segoe UI",sans-serif;
  --texto:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fondo:#0A0D22; --superficie:#141937; --hundido:#0E1230;
    --tinta:#ECEEFF; --tinta-2:#A3A9CF; --linea:#272D58;
    --marca:#8391FF; --marca-2:#B08CFF; --marca-tinta:#0A0D22; --foco:#8391FF;
    --sombra:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --sombra-alta:0 2px 4px rgba(0,0,0,.5),0 18px 40px -16px rgba(0,0,0,.8);
    --e-nueva:#FFC53D; --e-revision:#4CC9E8; --e-proceso:#B79CFF; --e-resuelta:#4FD39A; --e-descartada:#9AA0C2;
    --error:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --fondo:#0A0D22; --superficie:#141937; --hundido:#0E1230;
  --tinta:#ECEEFF; --tinta-2:#A3A9CF; --linea:#272D58;
  --marca:#8391FF; --marca-2:#B08CFF; --marca-tinta:#0A0D22; --foco:#8391FF;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --sombra-alta:0 2px 4px rgba(0,0,0,.5),0 18px 40px -16px rgba(0,0,0,.8);
  --e-nueva:#FFC53D; --e-revision:#4CC9E8; --e-proceso:#B79CFF; --e-resuelta:#4FD39A; --e-descartada:#9AA0C2;
  --error:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 1rem/1.5 var(--texto);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}

/* Barra superior */
.tope{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--fondo) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
.tope-in{max-width:1080px;margin:0 auto;padding:.7rem 1.25rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1.5rem}
.tope-in>div{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem .9rem}
h1{font:700 1.05rem/1.2 var(--titulos);margin:0;letter-spacing:-.01em}
#quien{margin:0;color:var(--tinta-2);font-size:.875rem}
.tabs{display:flex;gap:.2rem;overflow-x:auto;max-width:100%;background:var(--hundido);border-radius:99px;padding:.25rem}
.tabs:empty{display:none}
.tab{background:none;border:0;border-radius:99px;padding:.5rem .95rem;font-weight:600;font-size:.92rem;color:var(--tinta-2);white-space:nowrap;display:flex;align-items:center;gap:.4rem;transition:background .2s,color .2s}
.tab[aria-selected="true"]{color:var(--tinta);background:var(--superficie);box-shadow:var(--sombra)}
.cuenta-n{background:var(--marca);color:var(--marca-tinta);border-radius:99px;padding:0 .45rem;font-size:.75rem;font-weight:700;min-width:1.35rem;text-align:center}

main{max-width:1080px;margin:0 auto;padding:1.25rem 1.25rem 4rem}
main>*{animation:entra .3s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font:700 1.15rem/1.25 var(--titulos);margin:0 0 .25rem;letter-spacing:-.01em}
.ayuda{color:var(--tinta-2);margin:0 0 1.5rem;max-width:60ch}
.aviso{background:var(--superficie);border:1px solid var(--linea);border-radius:20px;padding:1.5rem;max-width:60ch;box-shadow:var(--sombra)}
.vacio{padding:2.5rem 1rem;text-align:center;color:var(--tinta-2)}
.vacio p{margin:0 0 1rem}

/* Banner animado */
.banner{position:relative;overflow:hidden;border-radius:26px;color:#fff;margin-bottom:1.5rem;
  background:linear-gradient(115deg,#1622A6,#3447F5 42%,#7A4DF3 78%,#A855F7);background-size:220% 220%;
  animation:deriva 16s ease-in-out infinite alternate, entra .3s ease both;box-shadow:var(--sombra-alta)}
@keyframes deriva{from{background-position:0% 40%}to{background-position:100% 60%}}
.rutas{position:absolute;inset:0 0 2.7rem 0;pointer-events:none}
.rutas svg{width:100%;height:100%;display:block}
.rutas path{fill:none;stroke:rgba(255,255,255,.6);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 12;animation:viaja 5s linear infinite}
.rutas path:nth-of-type(2){animation-duration:7s;stroke:rgba(255,255,255,.4)}
.rutas path:nth-of-type(3){animation-duration:9s;stroke:rgba(255,255,255,.3)}
@keyframes viaja{to{stroke-dashoffset:-130}}
.rutas .pdv{fill:var(--acento)}
.rutas .onda{fill:none;stroke:var(--acento);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:onda 2.6s ease-out infinite}
.rutas g:nth-of-type(2) .onda{animation-delay:.5s}
.rutas g:nth-of-type(3) .onda{animation-delay:1s}
.rutas g:nth-of-type(4) .onda{animation-delay:1.5s}
.rutas g:nth-of-type(5) .onda{animation-delay:2s}
@keyframes onda{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
.banner-txt{position:relative;z-index:1;padding:2rem 2rem 1.6rem;max-width:36rem}
.banner h2{font:700 clamp(1.45rem,4.2vw,2.3rem)/1.12 var(--titulos);margin:0 0 .6rem;color:#fff}
.banner p{margin:0;color:rgba(255,255,255,.88);max-width:52ch}
.banner .btn,.banner .btn.sec{background:#fff;color:#1622A6;margin-top:1.1rem;border:0}
.cinta{position:relative;z-index:1;overflow:hidden;background:rgba(8,11,40,.3);border-top:1px solid rgba(255,255,255,.18);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.cinta:empty{display:none}
.cinta-pista{display:flex;width:max-content;padding:.65rem 0;animation:corre var(--dur,40s) linear infinite}
.cinta:hover .cinta-pista{animation-play-state:paused}
@keyframes corre{to{transform:translateX(-50%)}}
.cinta-item{display:inline-flex;align-items:center;gap:.5rem;margin-right:2.2rem;white-space:nowrap;font-weight:600;font-size:.9rem}
.cinta-item::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--pt,rgba(255,255,255,.7))}
.cinta-item[data-e="nueva"]{--pt:#FFC53D}
.cinta-item[data-e="revision"]{--pt:#4CC9E8}
.cinta-item[data-e="proceso"]{--pt:#D2BDFF}
.cinta-item[data-e="resuelta"]{--pt:#4FD39A}
.cinta-item[data-e="descartada"]{--pt:#B9BEDC}

/* Formulario */
.form{background:var(--superficie);border:1px solid var(--linea);border-radius:22px;padding:1.75rem;max-width:720px;box-shadow:var(--sombra)}
.campo{margin-bottom:1.5rem}
.campo>label,.campo>.rotulo{display:block;font-weight:600;margin-bottom:.5rem}
.campo small{display:block;color:var(--tinta-2);font-weight:400;margin-top:.1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1.5px solid var(--linea);background:var(--superficie);border-radius:99px;padding:.55rem 1.05rem;font-weight:500;min-height:44px;transition:transform .15s,border-color .15s,background .15s}
.chip:hover{border-color:var(--marca)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--marca),var(--marca-2));border-color:transparent;color:var(--marca-tinta);font-weight:600;box-shadow:var(--sombra)}
.chips.grande .chip{flex:1 1 9rem;border-radius:16px;padding:1rem 1.1rem;font:500 .95rem/1.25 var(--titulos);text-align:left}
input[type=text],input[type=search],input[type=password],textarea,select{width:100%;border:1.5px solid transparent;background:var(--hundido);border-radius:14px;padding:.75rem .95rem;min-height:46px;transition:border-color .15s,background .15s,box-shadow .15s}
textarea{min-height:8rem;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{border-color:var(--marca);background:var(--superficie);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--marca) 20%,transparent)}
.pie-form{display:flex;flex-wrap:wrap;align-items:center;gap:1rem}
.btn{border:0;border-radius:99px;padding:.75rem 1.4rem;font-weight:600;min-height:46px;background:linear-gradient(135deg,var(--marca),var(--marca-2));color:var(--marca-tinta);box-shadow:var(--sombra);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sombra-alta)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.btn.sec{background:var(--superficie);border:1.5px solid var(--linea);color:var(--tinta);box-shadow:none}
.btn.sec:hover{border-color:var(--marca)}
.error{color:var(--error);font-weight:500;margin:0}

/* Estados */
.estado{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;font-size:.82rem;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:.2rem .7rem}
.estado::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--c)}
.chip .estado{background:none;padding:0;font-size:.92rem}
[data-estado="nueva"]{--c:var(--e-nueva)}
[data-estado="revision"]{--c:var(--e-revision)}
[data-estado="proceso"]{--c:var(--e-proceso)}
[data-estado="resuelta"]{--c:var(--e-resuelta)}
[data-estado="descartada"]{--c:var(--e-descartada)}

/* Lista de novedades */
.lista{display:grid;gap:.75rem;list-style:none;margin:0;padding:0}
.item{background:var(--superficie);border:1px solid var(--linea);border-radius:18px;padding:1.1rem 1.2rem 1.1rem 1.5rem;display:grid;gap:.45rem;box-shadow:inset 5px 0 0 var(--c),var(--sombra)}
.item-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.35rem 1rem}
.item h3{font:600 1.05rem/1.3 var(--texto);margin:0;overflow-wrap:anywhere}
.etqs{display:flex;flex-wrap:wrap;gap:.35rem;font-size:.8rem}
.etq{background:var(--hundido);border-radius:99px;padding:.12rem .65rem;font-weight:500}
.etq.fuerte{background:var(--tinta);color:var(--fondo)}
.meta{color:var(--tinta-2);font-size:.85rem}
.desc{margin:.2rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:75ch}
.resp{margin:.4rem 0 0;padding:.8rem .95rem;background:var(--hundido);border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.resp b{display:block;font-size:.85rem;margin-bottom:.15rem}
button.item{text-align:left;width:100%;cursor:pointer;transition:transform .15s,box-shadow .15s}
button.item:hover{transform:translateY(-2px);box-shadow:inset 5px 0 0 var(--c),var(--sombra-alta)}
.recorte{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Bandeja */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.6rem;margin-bottom:1rem}
.res{background:var(--superficie);border:1.5px solid var(--linea);border-radius:18px;padding:.9rem 1rem;text-align:left;box-shadow:var(--sombra);transition:transform .15s,border-color .15s,background .15s}
.res:hover{transform:translateY(-2px)}
.res b{display:block;font:700 1.55rem/1.1 var(--titulos);color:var(--c,var(--tinta))}
.res span{font-size:.85rem;color:var(--tinta-2);font-weight:500}
.res[aria-pressed="true"]{border-color:var(--c,var(--marca));background:color-mix(in srgb,var(--c,var(--marca)) 12%,var(--superficie))}
.filtros{display:grid;grid-template-columns:1fr 1fr 2fr;gap:.5rem;margin-bottom:1rem}
.filtros input,.filtros select{background:var(--superficie);border-color:var(--linea)}
@media (max-width:640px){
  .filtros{grid-template-columns:1fr 1fr}.filtros input{grid-column:1/-1}
  .form{padding:1.2rem}.banner{border-radius:20px}.banner-txt{padding:1.4rem 1.25rem 1.2rem}
  .rutas{opacity:.45}
}

/* Detalle */
dialog{border:0;border-radius:24px;padding:0;background:var(--superficie);color:var(--tinta);width:min(640px,calc(100vw - 1.5rem));max-height:calc(100vh - 2rem);box-shadow:var(--sombra-alta)}
dialog[open]{animation:abre .22s ease}
@keyframes abre{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(8,11,40,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.det{padding:1.6rem;display:grid;gap:1rem}
.det h2{overflow-wrap:anywhere}
.det .campo{margin:0}
.det-pie{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.5rem;align-items:center}

/* Catálogo y supervisores */
.cat{background:var(--superficie);border:1px solid var(--linea);border-radius:18px;padding:1.1rem;margin-bottom:.75rem;display:grid;gap:.6rem;max-width:720px;box-shadow:var(--sombra)}
.cat-cab{display:flex;gap:.5rem}
.cat textarea{min-height:6.5rem}
.enlace{background:none;border:0;color:var(--marca);font-weight:600;padding:.4rem 0;text-decoration:underline}
.entrar{max-width:440px;margin:0 auto;display:grid;gap:.25rem}
.entrar h2{margin-bottom:1rem}
.entrar .enlace{justify-self:start;margin-top:.5rem}
#quien .enlace{padding:0;font-size:.875rem}
.fila-sup{display:grid;grid-template-columns:2fr 1fr;gap:.5rem}
.item.sup{grid-template-columns:1fr auto;align-items:center}
@media (max-width:480px){.fila-sup{grid-template-columns:1fr}}

#toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--tinta);color:var(--fondo);padding:.75rem 1.2rem;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 2rem);box-shadow:var(--sombra-alta)}
#toast.ver{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .cinta{overflow-x:auto}
}
</style>
</head>
<body>
<header class="tope">
  <div class="tope-in">
    <div>
      <h1>Novedades</h1>
      <p id="quien"></p>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  </div>
</header>
<main id="vista"><p class="meta">Cargando…</p></main>
<dialog id="detalle" aria-label="Detalle de la novedad"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONFIGURACIÓN: pega aquí los dos datos de tu proyecto de Supabase ============ */
var SUPABASE_URL = "https://roqsranzstyuvdjtayrn.supabase.co";
var SUPABASE_KEY = "sb_publishable_Bq0qRIHovspa-mk9S1kvOQ_nRpkvgZL";
/* ========================================================================================== */

(function(){
"use strict";

var ESTADOS = [
  { id:"nueva", nombre:"Nueva" },
  { id:"revision", nombre:"En revisión" },
  { id:"proceso", nombre:"En proceso" },
  { id:"resuelta", nombre:"Resuelta" },
  { id:"descartada", nombre:"Descartada" }
];
var S = {
  sesion:null,                       // {rol:"sup",id,nombre,pin} o {rol:"admin",clave}
  catalogo:{cuentas:[],categorias:[]},
  mias:[], todas:[], supervisores:[],
  vista:"", form:{cuenta:"",categoria:"",tipo:""},
  filtro:{estado:"",cuenta:"",categoria:"",texto:""}
};

var $ = function(id){ return document.getElementById(id); };
function h(tag, attrs){
  var el = document.createElement(tag), k, v;
  attrs = attrs || {};
  for (k in attrs){
    v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if (Array.isArray(c)) c.forEach(function(x){ if (x != null && x !== false) el.append(x); });
    else if (c != null && c !== false) el.append(c);
  }
  return el;
}
function nombreEstado(id){ var e = ESTADOS.find(function(x){ return x.id === id; }); return e ? e.nombre : "Nueva"; }
function fecha(ts){
  if (!ts) return "";
  var d = new Date(ts);
  try { return d.toLocaleString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }
  catch(e){ return d.toDateString(); }
}
var tToast;
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("ver"); clearTimeout(tToast); tToast = setTimeout(function(){ t.classList.remove("ver"); }, 2800); }
function limpiarLista(a){
  if (!Array.isArray(a)) return [];
  var out = [];
  a.forEach(function(x){ x = String(x == null ? "" : x).trim(); if (x && out.indexOf(x) < 0) out.push(x); });
  return out;
}
function normalizarCatalogo(d){
  d = d || {};
  return {
    cuentas: limpiarLista(d.cuentas),
    categorias: (Array.isArray(d.categorias) ? d.categorias : []).map(function(c){
      return { nombre:String((c && c.nombre) || "").trim(), tipos:limpiarLista(c && c.tipos) };
    }).filter(function(c){ return c.nombre; })
  };
}

/* ---------- Conexión con Supabase ---------- */
async function rpc(fn, args){
  var r = await fetch(SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":"Bearer " + SUPABASE_KEY },
    body: JSON.stringify(args || {})
  });
  if (!r.ok) throw new Error("Error " + r.status);
  var t = await r.text();
  return t ? JSON.parse(t) : null;
}
function guardarSesion(){ try{ S.sesion ? localStorage.setItem("nov_sesion", JSON.stringify(S.sesion)) : localStorage.removeItem("nov_sesion"); }catch(e){} }
function leerSesion(){ try{ return JSON.parse(localStorage.getItem("nov_sesion") || "null"); }catch(e){ return null; } }
var ERR_RED = "No se pudo conectar. Revisa tu internet e inténtalo de nuevo.";

/* ---------- Banner animado ---------- */
var RUTAS_SVG = '<svg viewBox="0 0 800 240" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">'
  + '<path d="M320 215 C420 125 480 205 560 112 S700 60 795 38"/>'
  + '<path d="M380 28 C460 80 540 20 620 92 S720 192 800 172"/>'
  + '<path d="M250 122 C330 60 400 150 470 72"/>'
  + [[560,112],[620,92],[470,72],[320,215],[380,28]].map(function(p){
      return '<g><circle class="onda" cx="'+p[0]+'" cy="'+p[1]+'" r="6"/><circle class="pdv" cx="'+p[0]+'" cy="'+p[1]+'" r="5"/></g>';
    }).join("")
  + '</svg>';
function cintaCatalogo(){
  var out = S.catalogo.cuentas.map(function(c){ return { t:c }; });
  S.catalogo.categorias.forEach(function(c){
    if (c.tipos.length) c.tipos.forEach(function(t){ out.push({ t:c.nombre + ": " + t }); });
    else out.push({ t:c.nombre });
  });
  return out;
}
function cintaNovedades(lista){
  if (!lista.length) return cintaCatalogo();
  return lista.slice(0,12).map(function(n){ return { e:n.estado || "nueva", t:(n.cuenta || "") + ": " + (n.nombre || "") + " (" + nombreEstado(n.estado) + ")" }; });
}
function pintarCinta(items){
  var el = $("cinta"); if (!el) return;
  var firma = JSON.stringify(items);
  if (el.dataset.firma === firma) return;       // sin cambios: no se reinicia el movimiento
  el.dataset.firma = firma;
  if (!items.length){ el.replaceChildren(); return; }
  var base = items; while (base.length < 8) base = base.concat(items);

  var pin = h("input",{id:"s-pin",type:"text",inputmode:"numeric",maxlength:"12",placeholder:"PIN (mínimo 4 dígitos)","aria-label":"PIN"});
  var err = h("p",{class:"error",role:"alert"});
  var add = h("button",{class:"btn",text:"Guardar supervisor",onclick:async function(){
    var n = nom.value.trim(), p = pin.value.trim();
    err.textContent = !n ? "Escribe el nombre." : p.length < 4 ? "El PIN debe tener al menos 4 caracteres." : "";
    if (err.textContent) return;
    add.disabled = true;
    try {
      if (!(await rpc("admin_guardar_supervisor",{p_clave:S.sesion.clave,p_nombre:n,p_pin:p}))) throw new Error("rechazado");
      nom.value = ""; pin.value = ""; toast("Supervisor guardado"); await cargarSupervisores();
    } catch(e){ err.textContent = "No se pudo guardar el supervisor."; }
    add.disabled = false;
  }});
  $("vista").replaceChildren(
    banner("Supervisores","Cada supervisor entra con su nombre y su PIN. Para cambiarle el PIN a alguien, guárdalo otra vez con el mismo nombre y el PIN nuevo.",cintaCatalogo()),
    h("div",{class:"cat"}, h("div",{class:"fila-sup"}, nom, pin), h("div",{class:"pie-form"}, add, err)),
    h("div",{id:"s-lista"}, h("p",{class:"meta",text:"Cargando…"})));
  cargarSupervisores();
}
async function cargarSupervisores(){
  var cont = $("s-lista");
  try { S.supervisores = await rpc("admin_supervisores",{p_clave:S.sesion.clave}) || []; }
  catch(e){ if (cont) cont.replaceChildren(h("p",{class:"error",text:ERR_RED})); return; }
  if (!cont) return;
  if (!S.supervisores.length){ cont.replaceChildren(h("div",{class:"vacio"}, h("p",{text:"Aún no hay supervisores. Agrega el primero arriba."}))); return; }
  cont.replaceChildren(h("ul",{class:"lista",style:"max-width:720px"}, S.supervisores.map(function(s){
    return h("li",{class:"item sup","data-estado":s.activo ? "resuelta" : "descartada"},
      h("div",{}, h("h3",{text:s.nombre}), h("span",{class:"meta",text:"PIN " + s.pin + (s.activo ? "" : " (desactivado)")})),
      h("button",{class:"btn sec",text:s.activo ? "Desactivar" : "Reactivar",onclick:async function(){
        try { await rpc("admin_activar_supervisor",{p_clave:S.sesion.clave,p_id:s.id,p_activo:!s.activo}); toast(s.activo ? "Supervisor desactivado" : "Supervisor reactivado"); cargarSupervisores(); }
        catch(e){ toast("Sin conexión"); }
      }}));
  })));
}

iniciar();
})();
</script>
</body>
</html>
